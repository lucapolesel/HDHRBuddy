name: check

# Builds both ways HDHRBuddy ships, on every PR (Dependabot's included) and push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build the package
        run: nix build -L .#default
      - name: Evaluate the flake (package and NixOS module)
        run: nix flake check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # amd64 only and not pushed: build-publish.yml builds both platforms on release tags.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
